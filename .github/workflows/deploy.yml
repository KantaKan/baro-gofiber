name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o baro-backend-linux ./cmd
      - name: Deploy to droplet
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "103.253.146.20 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMutaYk/T23dBySX7UZ5B2yBCzZ/Mj6HeHGfXQBkSlv8" > ~/.ssh/known_hosts
          scp baro-backend-linux root@103.253.146.20:/tmp/baro-backend
          ssh root@103.253.146.20 'install -m 755 /tmp/baro-backend /opt/baro/baro-backend && systemctl restart baro && sleep 5 && systemctl is-active baro'
